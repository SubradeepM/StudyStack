<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM LB - Leader</title>
    <style>
        body {
            background-image: url('background2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        .leader {
            text-align: center;
            margin-top: 40px;
        }
        .leader img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5);
            border: 3px solid white;
        }
        .leader h2 {
            margin-top: 15px;
            font-size: 28px;
            color: white;
        }
        .leader p {
            font-size: 18px;
            opacity: 0.9;
        }
        .badge {
            display: inline-block;
            background-color: #ffcc00;
            color: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 TEAM LB 🏆</h1>
        <div class="leader">
            <img src="team4.jpg" alt="Subradeep Majumder">
            <h2>Subradeep Majumder <span class="badge">LEADER</span></h2>
            <p>Leading the team with vision and excellence</p>
        </div>
    </div>
</body>
</html>
